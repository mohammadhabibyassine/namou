<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Namou Admin - Attributes</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts: Oswald (Display Condensed) and Space Mono / JetBrains Mono -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Oswald:wght@500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                bg: "#f8f8f6",
                sidebar: "#fbfbfa",
                card: "#ffffff",
                border: "#e6e6e2",
                borderDark: "#deded9",
                lime: "#ccff00",
                limeDark: "#b8e600",
                activeGray: "#ecece8",
                muted: "#7b7b75",
                dim: "#a1a19b",
                warningBg: "#fffdf0",
                warningBorder: "#f8eec4",
                warningText: "#474533",
                dark: "#0f0f0f",
              },
            },
            fontFamily: {
              display: ["Oswald", "sans-serif"],
              mono: ['"JetBrains Mono"', "monospace"],
            },
          },
        },
      };
    </script>
    <style data-purpose="base-styling">
      body {
        background-color: #f7f7f5;
        color: #0f0f0f;
        font-family: "JetBrains Mono", monospace;
        letter-spacing: -0.01em;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body
    class="selection:bg-brand-lime flex min-h-screen flex-col antialiased selection:text-black"
  >
    <!-- BEGIN: MainApplicationContainer -->
    <div class="flex min-h-screen w-full">
      <!-- BEGIN: Sidebar -->
      <aside
        class="flex w-56 shrink-0 flex-col justify-between border-r border-[#e8e8e4] bg-[#fbfbfa] px-0 py-7 select-none"
        data-purpose="sidebar-navigation"
      >
        <div>
          <!-- Brand Title -->
          <div class="mb-14 px-7">
            <h1
              class="font-display text-[22px] leading-none font-bold tracking-wide text-black uppercase"
            >
              NAMOU ADMIN
            </h1>
          </div>
          <!-- Navigation Links -->
          <nav class="space-y-3 px-3">
            <!-- Orders -->
            <a
              class="block px-4 py-2 font-mono text-[13px] font-semibold tracking-wider text-[#1a1a1a] transition-colors hover:text-black"
              href="#"
            >
              ORDERS
            </a>
            <!-- Products -->
            <a
              class="block px-4 py-2 font-mono text-[13px] font-semibold tracking-wider text-[#1a1a1a] transition-colors hover:text-black"
              href="#"
            >
              PRODUCTS
            </a>
            <!-- Categories -->
            <a
              class="block px-4 py-2 font-mono text-[13px] font-semibold tracking-wider text-[#1a1a1a] transition-colors hover:text-black"
              href="#"
            >
              CATEGORIES
            </a>
            <!-- Attributes (Active) -->
            <div class="relative">
              <a
                class="flex items-center rounded-lg bg-[#ecece9] py-2.5 pr-3 pl-4 font-mono text-[13px] font-bold tracking-wider text-black"
                href="#"
              >
                <!-- Lime vertical indicator pill -->
                <span
                  class="absolute left-1.5 h-5 w-[3.5px] rounded-full bg-[#c8ff00]"
                ></span>
                <span class="ml-1">ATTRIBUTES</span>
              </a>
            </div>
          </nav>
        </div>
        <!-- Logout Anchor at Bottom -->
        <div class="px-7 pt-4">
          <a
            class="block font-mono text-[13px] font-semibold tracking-wider text-[#1a1a1a] transition-colors hover:text-black"
            href="#"
          >
            LOGOUT
          </a>
        </div>
      </aside>
      <!-- END: Sidebar -->
      <!-- BEGIN: MainContent -->
      <main
        class="flex min-w-0 flex-1 flex-col bg-[#f7f7f5] p-8 lg:p-10"
        data-purpose="main-workspace"
      >
        <!-- BEGIN: ContentHeader -->
        <header class="flex items-center justify-between pb-7">
          <h2
            class="font-display text-4xl font-bold tracking-normal text-black uppercase"
          >
            ATTRIBUTES
          </h2>
          <!-- Top Right Action Button -->
          <button
            class="inline-flex items-center gap-2 rounded-lg border border-[#c0f000] bg-[#ccff00] px-5 py-2.5 font-mono text-xs font-bold tracking-wider text-black shadow-sm transition-transform hover:bg-[#bbf000] active:scale-[0.99]"
            type="button"
          >
            <span class="text-base leading-none font-bold">+</span>
            <span>CREATE ATTRIBUTE TYPE</span>
          </button>
        </header>
        <!-- END: ContentHeader -->
        <!-- BEGIN: TwoColumnWorkspaceGrid -->
        <div class="grid grid-cols-1 items-start gap-6 xl:grid-cols-2">
          <!-- BEGIN: LeftPanelAttributeTypes -->
          <section
            class="flex min-h-[640px] flex-col overflow-hidden rounded-xl border border-[#e4e4df] bg-white shadow-[0_1px_3px_rgba(0,0,0,0.02)]"
            data-purpose="attribute-types-list"
          >
            <!-- Table Header -->
            <div
              class="grid grid-cols-12 gap-2 border-b border-[#ecece8] px-6 py-4 font-mono text-[11px] font-medium tracking-wider text-[#787873] uppercase"
            >
              <div class="col-span-6 leading-tight">
                ATTRIBUTE TYPE<br />
                <span class="text-[10px] text-[#9c9c96]">SLUG</span>
              </div>
              <div class="col-span-2 text-center leading-tight">
                SORT<br />ORDER
              </div>
              <div class="col-span-4 text-center leading-tight">
                VALUE<br />COUNT
              </div>
            </div>
            <!-- Table Rows Container -->
            <div class="divide-y divide-[#efefe9]">
              <!-- Row 1 (Active/Selected: COLOR) -->
              <div
                class="relative grid grid-cols-12 items-center gap-2 bg-[#f2f2ef]/80 px-6 py-4"
              >
                <!-- Lime active bar on the card's edge -->
                <div
                  class="absolute top-0 bottom-0 left-0 w-1 bg-[#ccff00]"
                ></div>
                <div class="col-span-6 pl-1">
                  <div
                    class="font-mono text-sm font-bold tracking-wide text-black uppercase"
                  >
                    COLOR
                  </div>
                  <div
                    class="mt-0.5 font-mono text-xs font-normal text-[#70706b] lowercase"
                  >
                    color
                  </div>
                </div>
                <div
                  class="col-span-2 text-center font-mono text-xs font-semibold text-black"
                >
                  1
                </div>
                <div class="col-span-4 flex items-center justify-between pl-4">
                  <span
                    class="w-6 text-center font-mono text-xs font-semibold text-black"
                    >3</span
                  >
                  <div
                    class="flex items-center gap-3 pr-1 font-mono text-[11px] font-bold tracking-wider"
                  >
                    <button
                      class="text-black transition-opacity hover:opacity-75"
                      type="button"
                    >
                      EDIT
                    </button>
                    <button
                      class="text-black transition-opacity hover:opacity-75"
                      type="button"
                    >
                      DELETE
                    </button>
                  </div>
                </div>
              </div>
              <!-- Row 2 (SIZE) -->
              <div
                class="grid grid-cols-12 items-center gap-2 px-6 py-4 transition-colors hover:bg-[#fafaf7]"
              >
                <div class="col-span-6 pl-1">
                  <div
                    class="font-mono text-sm font-bold tracking-wide text-black uppercase"
                  >
                    SIZE
                  </div>
                  <div
                    class="mt-0.5 font-mono text-xs font-normal text-[#70706b] lowercase"
                  >
                    size
                  </div>
                </div>
                <div
                  class="col-span-2 text-center font-mono text-xs font-semibold text-black"
                >
                  2
                </div>
                <div class="col-span-4 flex items-center justify-between pl-4">
                  <span
                    class="w-6 text-center font-mono text-xs font-semibold text-black"
                    >6</span
                  >
                  <div
                    class="flex items-center gap-3 pr-1 font-mono text-[11px] font-bold tracking-wider"
                  >
                    <button
                      class="text-black transition-opacity hover:opacity-75"
                      type="button"
                    >
                      EDIT
                    </button>
                    <button
                      class="text-black transition-opacity hover:opacity-75"
                      type="button"
                    >
                      DELETE
                    </button>
                  </div>
                </div>
              </div>
              <!-- Row 3 (MATERIAL) -->
              <div
                class="grid grid-cols-12 items-center gap-2 px-6 py-4 transition-colors hover:bg-[#fafaf7]"
              >
                <div class="col-span-6 pl-1">
                  <div
                    class="font-mono text-sm font-bold tracking-wide text-black uppercase"
                  >
                    MATERIAL
                  </div>
                  <div
                    class="mt-0.5 font-mono text-xs font-normal text-[#70706b] lowercase"
                  >
                    material
                  </div>
                </div>
                <div
                  class="col-span-2 text-center font-mono text-xs font-semibold text-black"
                >
                  3
                </div>
                <div class="col-span-4 flex items-center justify-between pl-4">
                  <span
                    class="w-6 text-center font-mono text-xs font-semibold text-black"
                    >4</span
                  >
                  <div
                    class="flex items-center gap-3 pr-1 font-mono text-[11px] font-bold tracking-wider"
                  >
                    <button
                      class="text-black transition-opacity hover:opacity-75"
                      type="button"
                    >
                      EDIT
                    </button>
                    <button
                      class="text-black transition-opacity hover:opacity-75"
                      type="button"
                    >
                      DELETE
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </section>
          <!-- END: LeftPanelAttributeTypes -->
          <!-- BEGIN: RightPanelAttributeValues -->
          <section
            class="flex min-h-[640px] flex-col gap-6 rounded-xl border border-[#e4e4df] bg-white p-6 shadow-[0_1px_3px_rgba(0,0,0,0.02)]"
            data-purpose="attribute-values-manager"
          >
            <!-- Subtitle / Header -->
            <div class="pt-1">
              <h3
                class="font-mono text-base font-bold tracking-wider text-black uppercase"
              >
                COLOR / VALUES
              </h3>
            </div>
            <!-- Warning Box -->
            <div
              class="flex items-center gap-3.5 rounded-lg border border-[#f5ebc4] bg-[#fffdf0] px-4 py-3.5 text-[#2c2b20]"
              data-purpose="warning-banner"
            >
              <!-- Warning Triangle SVG Icon -->
              <svg
                class="h-4 w-4 shrink-0 text-black"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                viewbox="0 0 24 24"
              >
                <path
                  d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"
                ></path>
                <line x1="12" x2="12" y1="9" y2="13"></line>
                <line x1="12" x2="12.01" y1="17" y2="17"></line>
              </svg>
              <span
                class="font-mono text-[11px] font-semibold tracking-wider text-black"
              >
                VALUES USED BY PRODUCTS CANNOT BE DELETED.
              </span>
            </div>
            <!-- Values Table Container -->
            <div class="flex flex-col">
              <!-- Table Header -->
              <div
                class="grid grid-cols-12 gap-4 border-b border-[#f0f0ec] pb-2 font-mono text-[11px] font-medium tracking-wider text-[#787873] uppercase"
              >
                <div class="col-span-6">VALUE</div>
                <div class="col-span-3 text-center">SORT ORDER</div>
                <div class="col-span-3"></div>
              </div>
              <!-- Value Row 1: BLACK -->
              <div
                class="grid grid-cols-12 items-center gap-4 border-b border-[#f0f0ec] py-4 font-mono text-xs"
              >
                <div
                  class="col-span-6 font-bold tracking-wider text-black uppercase"
                >
                  BLACK
                </div>
                <div class="col-span-3 text-center font-medium text-black">
                  1
                </div>
                <div
                  class="col-span-3 flex justify-end gap-3 text-[11px] font-bold tracking-wider"
                >
                  <button
                    class="text-black transition-opacity hover:opacity-70"
                    type="button"
                  >
                    EDIT
                  </button>
                  <button
                    class="text-black transition-opacity hover:opacity-70"
                    type="button"
                  >
                    DELETE
                  </button>
                </div>
              </div>
              <!-- Value Row 2: OLIVE -->
              <div
                class="grid grid-cols-12 items-center gap-4 border-b border-[#f0f0ec] py-4 font-mono text-xs"
              >
                <div
                  class="col-span-6 font-bold tracking-wider text-black uppercase"
                >
                  OLIVE
                </div>
                <div class="col-span-3 text-center font-medium text-black">
                  2
                </div>
                <div
                  class="col-span-3 flex justify-end gap-3 text-[11px] font-bold tracking-wider"
                >
                  <button
                    class="text-black transition-opacity hover:opacity-70"
                    type="button"
                  >
                    EDIT
                  </button>
                  <button
                    class="text-black transition-opacity hover:opacity-70"
                    type="button"
                  >
                    DELETE
                  </button>
                </div>
              </div>
              <!-- Value Row 3: STONE -->
              <div
                class="grid grid-cols-12 items-center gap-4 py-4 font-mono text-xs"
              >
                <div
                  class="col-span-6 font-bold tracking-wider text-black uppercase"
                >
                  STONE
                </div>
                <div class="col-span-3 text-center font-medium text-black">
                  3
                </div>
                <div
                  class="col-span-3 flex justify-end gap-3 text-[11px] font-bold tracking-wider"
                >
                  <button
                    class="text-black transition-opacity hover:opacity-70"
                    type="button"
                  >
                    EDIT
                  </button>
                  <button
                    class="text-black transition-opacity hover:opacity-70"
                    type="button"
                  >
                    DELETE
                  </button>
                </div>
              </div>
            </div>
            <!-- BEGIN: AddValueCard -->
            <div
              class="mt-2 flex flex-col gap-4 rounded-xl border border-[#e4e4df] bg-white p-6"
              data-purpose="add-value-form"
            >
              <h4
                class="font-mono text-sm font-bold tracking-wider text-black uppercase"
              >
                ADD VALUE
              </h4>
              <!-- Input Fields Row -->
              <form class="space-y-5" onsubmit="event.preventDefault()">
                <div class="grid grid-cols-12 gap-4">
                  <!-- Value Input -->
                  <div class="col-span-7">
                    <label
                      class="mb-2 block font-mono text-[10px] font-semibold tracking-wider text-[#666661] uppercase"
                      for="input-value"
                    >
                      VALUE
                    </label>
                    <input
                      class="h-11 w-full rounded-lg border border-[#deded9] bg-white px-3.5 font-mono text-xs text-black placeholder-[#80807b] transition-colors focus:border-black focus:ring-0 focus:outline-none"
                      id="input-value"
                      placeholder="Enter value"
                      type="text"
                    />
                  </div>
                  <!-- Sort Order Input -->
                  <div class="col-span-5">
                    <label
                      class="mb-2 block font-mono text-[10px] font-semibold tracking-wider text-[#666661] uppercase"
                      for="input-sort"
                    >
                      SORT ORDER
                    </label>
                    <input
                      class="h-11 w-full rounded-lg border border-[#deded9] bg-white px-3.5 font-mono text-xs text-black transition-colors focus:border-black focus:ring-0 focus:outline-none"
                      id="input-sort"
                      type="text"
                      value="4"
                    />
                  </div>
                </div>
                <!-- Submit Button -->
                <div class="flex justify-end pt-1">
                  <button
                    class="rounded-lg border border-[#c0f000] bg-[#ccff00] px-6 py-3 font-mono text-xs font-bold tracking-wider text-black uppercase shadow-sm transition-transform hover:bg-[#bbf000] active:scale-[0.99]"
                    type="submit"
                  >
                    CREATE VALUE
                  </button>
                </div>
              </form>
            </div>
            <!-- END: AddValueCard -->
          </section>
          <!-- END: RightPanelAttributeValues -->
        </div>
        <!-- END: TwoColumnWorkspaceGrid -->
      </main>
      <!-- END: MainContent -->
    </div>
    <!-- END: MainApplicationContainer -->
  </body>
</html>
